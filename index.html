<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkaiBird</title>
    <!-- Tailwind CSS for mobile-first modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons for mobile navigation and actions -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24 select-none">

    <!-- Top Header -->
    <header class="bg-emerald-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-feather-pointed mr-2"></i>SkaiBird</h1>
        <span id="location-badge" class="text-xs bg-emerald-700 px-2.5 py-1 rounded-full font-medium truncate max-w-[180px]">
            <i class="fa-solid fa-location-dot mr-1"></i>Detecting location...
        </span>
    </header>

    <!-- Main Container Area -->
    <main class="max-w-md mx-auto p-4">

        <!-- TAB 1: IDENTIFY -->
        <section id="tab-identify" class="tab-content active space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-semibold text-slate-900 mb-1">Identify a Bird</h2>
                <p class="text-xs text-slate-500 mb-4">Upload a clear photo or record an audio clip of a bird call.</p>

                <!-- Media Input Actions -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-200 rounded-xl cursor-pointer hover:border-emerald-500 bg-slate-50 transition">
                        <i class="fa-solid fa-camera text-emerald-600 text-xl mb-1"></i>
                        <span class="text-xs font-medium text-slate-600">Upload Photo</span>
                        <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>

                    <button id="record-btn" onclick="toggleAudioRecording()" class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-200 rounded-xl hover:border-emerald-500 bg-slate-50 transition">
                        <i id="mic-icon" class="fa-solid fa-microphone text-emerald-600 text-xl mb-1"></i>
                        <span id="record-text" class="text-xs font-medium text-slate-600">Record Audio</span>
                    </button>
                </div>

                <!-- Preview Container -->
                <div id="media-preview" class="hidden mb-4 rounded-xl overflow-hidden bg-black max-h-60 flex items-center justify-center relative">
                    <img id="image-preview" class="w-full h-auto object-contain hidden" alt="Uploaded bird preview">
                    <div id="audio-indicator" class="hidden text-white text-xs p-4 flex items-center space-x-2">
                        <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
                        <span id="audio-timer">Recording audio...</span>
                    </div>
                </div>

                <button onclick="analyzeBird()" class="w-full bg-emerald-600 text-white font-medium py-3 rounded-xl shadow-md hover:bg-emerald-700 active:scale-[0.98] transition">
                    Run Identification
                </button>
            </div>

            <!-- Analysis Output Result Card -->
            <div id="result-container" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div id="res-image-wrapper" class="h-48 bg-slate-200 bg-cover bg-center"></div>
                <div class="p-5 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 id="res-name" class="text-xl font-bold text-slate-950"></h3>
                            <p id="res-scientific" class="text-xs italic text-slate-500"></p>
                        </div>
                        <button onclick="saveCurrentBird()" class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-emerald-100 transition">
                            <i class="fa-solid fa-bookmark mr-1"></i>Save Bird
                        </button>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Habitat</h4>
                        <p id="res-habitat" class="text-sm text-slate-700"></p>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Geographical Range</h4>
                        <p id="res-range" class="text-sm text-slate-700"></p>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Background Summary</h4>
                        <p id="res-summary" class="text-sm text-slate-700 leading-relaxed"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 2: EXPLORE -->
        <section id="tab-explore" class="tab-content space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h2 class="text-lg font-semibold text-slate-900">Birds in Your Area</h2>
                <span class="text-xs text-slate-400" id="explore-count">Loading local species...</span>
            </div>
            <div id="explore-list" class="space-y-3">
                <!-- Populated dynamically via JS -->
            </div>
        </section>

        <!-- TAB 3: MY BIRDS -->
        <section id="tab-my-birds" class="tab-content space-y-3">
            <h2 class="text-lg font-semibold text-slate-900 mb-1">Saved Birds</h2>
            <div id="saved-birds-list" class="space-y-3">
                <!-- Populated dynamically via JS -->
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-3 px-2 z-50 max-w-md mx-auto shadow-lg">
        <button onclick="switchTab('identify')" id="nav-identify" class="flex flex-col items-center text-emerald-600 transition">
            <i class="fa-solid fa-magnifying-glass text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">Identify</span>
        </button>
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center text-slate-400 transition">
            <i class="fa-solid fa-binoculars text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">Explore</span>
        </button>
        <button onclick="switchTab('my-birds')" id="nav-my-birds" class="flex flex-col items-center text-slate-400 transition">
            <i class="fa-solid fa-bookmark text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">My Birds</span>
        </button>
    </nav>

    <!-- Script Application Logic -->
    <script>
        let currentDetectedBird = null;
        let savedBirds = JSON.parse(localStorage.getItem('skai_saved_birds') || '[]');
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];
        let uploadedImageBase64 = null;

        window.addEventListener('DOMContentLoaded', () => {
            initLocation();
            renderSavedBirds();
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-emerald-600');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tab-${tabName}`).classList.add('active');
            const activeBtn = document.getElementById(`nav-${tabName}`);
            activeBtn.classList.remove('text-slate-400');
            activeBtn.classList.add('text-emerald-600');

            if(tabName === 'explore') {
                loadExploreBirds();
            }
        }

        function initLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        document.getElementById('location-badge').innerHTML = `<i class="fa-solid fa-location-dot mr-1"></i>Local Area (${position.coords.latitude.toFixed(1)}°, ${position.coords.longitude.toFixed(1)}°)`;
                    },
                    () => {
                        document.getElementById('location-badge').innerHTML = `<i class="fa-solid fa-location-dot mr-1"></i>Global Region`;
                    }
                );
            } else {
                document.getElementById('location-badge').innerHTML = `<i class="fa-solid fa-location-dot mr-1"></i>Default Area`;
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    const preview = document.getElementById('image-preview');
                    preview.src = uploadedImageBase64;
                    preview.classList.remove('hidden');
                    document.getElementById('media-preview').classList.remove('hidden');
                    document.getElementById('audio-indicator').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        async function toggleAudioRecording() {
            const recordBtn = document.getElementById('record-btn');
            const micIcon = document.getElementById('mic-icon');
            const recordText = document.getElementById('record-text');
            const previewContainer = document.getElementById('media-preview');
            const audioIndicator = document.getElementById('audio-indicator');
            const imagePreview = document.getElementById('image-preview');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.start();
                    isRecording = true;
                    
                    recordBtn.classList.add('border-red-500', 'bg-red-50');
                    micIcon.classList.remove('text-emerald-600');
                    micIcon.classList.add('text-red-500', 'animate-bounce');
                    recordText.innerText = "Stop Recording";

                    imagePreview.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                    audioIndicator.classList.remove('hidden');
                } catch (err) {
                    alert("Microphone permission unavailable or restricted on device.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('border-red-500', 'bg-red-50');
                micIcon.classList.add('text-emerald-600');
                micIcon.classList.remove('text-red-500', 'animate-bounce');
                recordText.innerText = "Record Audio";
                audioIndicator.classList.add('hidden');
                previewContainer.classList.add('hidden');
            }
        }

        function analyzeBird() {
            currentDetectedBird = {
                id: Date.now(),
                name: "American Robin",
                scientific: "Turdus migratorius",
                habitat: "Woodlands, gardens, suburban parks, and lawns with access to open ground.",
                range: "Widespread across North America, ranging from Alaska down to central Mexico.",
                summary: "A migratory songbird of the true thrush family, widely known as a harbinger of spring. They possess a cheerful, caroling song and forage eagerly on lawns for earthworms.",
                image: uploadedImageBase64 || "https://images.unsplash.com/photo-1555169062-01347abf4ba3?auto=format&fit=crop&w=600&q=80"
            };

            document.getElementById('res-name').innerText = currentDetectedBird.name;
            document.getElementById('res-scientific').innerText = currentDetectedBird.scientific;
            document.getElementById('res-habitat').innerText = currentDetectedBird.habitat;
            document.getElementById('res-range').innerText = currentDetectedBird.range;
            document.getElementById('res-summary').innerText = currentDetectedBird.summary;
            document.getElementById('res-image-wrapper').style.backgroundImage = `url('${currentDetectedBird.image}')`;
            
            document.getElementById('result-container').classList.remove('hidden');
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function saveCurrentBird() {
            if (!currentDetectedBird) return;
            try {
                if (!savedBirds.some(b => b.name === currentDetectedBird.name)) {
                    savedBirds.push(currentDetectedBird);
                    localStorage.setItem('skai_saved_birds', JSON.stringify(savedBirds));
                    renderSavedBirds();
                    alert("Bird successfully saved to 'My Birds'!");
                } else {
                    alert("This bird is already saved in your collection.");
                }
            } catch (e) {
                alert("Storage limit reached! Unable to save more birds.");
            }
        }

        function renderSavedBirds() {
            const listContainer = document.getElementById('saved-birds-list');
            if (savedBirds.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">No saved birds yet. Identify and bookmark birds to view them here.</div>`;
                return;
            }

            listContainer.innerHTML = savedBirds.map(bird => `
                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center space-x-3">
                    <img src="${bird.image}" class="w-16 h-16 rounded-lg object-cover bg-slate-100">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-900 text-sm truncate">${bird.name}</h4>
                        <p class="text-xs italic text-slate-500 truncate">${bird.scientific}</p>
                        <p class="text-[11px] text-slate-400 truncate mt-1">${bird.habitat}</p>
                    </div>
                    <button onclick="removeSavedBird(${bird.id})" class="text-slate-300 hover:text-red-500 p-2">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeSavedBird(id) {
            savedBirds = savedBirds.filter(b => b.id !== id);
            localStorage.setItem('skai_saved_birds', JSON.stringify(savedBirds));
            renderSavedBirds();
        }

        function loadExploreBirds() {
            const exploreList = document.getElementById('explore-list');
            const mockExploreData = [
                { name: "Northern Cardinal", scientific: "Cardinalis cardinalis", status: "Common in your region", image: "https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?auto=format&fit=crop&w=400&q=80" },
                { name: "Blue Jay", scientific: "Cyanocitta cristata", status: "Active today", image: "https://images.unsplash.com/photo-1606567595334-d39972c85dbe?auto=format&fit=crop&w=400&q=80" },
                { name: "European Starling", scientific: "Sturnus vulgaris", status: "High local population", image: "https://images.unsplash.com/photo-1544256718-3bcf237f3974?auto=format&fit=crop&w=400&q=80" },
                { name: "Mourning Dove", scientific: "Zenaida macroura", status: "Frequent visitor", image: "https://images.unsplash.com/photo-1569683795645-b62e50fbf103?auto=format&fit=crop&w=400&q=80" }
            ];

            document.getElementById('explore-count').innerText = `${mockExploreData.length} species spotted nearby`;
            exploreList.innerHTML = mockExploreData.map(bird => `
                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-center space-x-3">
                    <img src="${bird.image}" class="w-14 h-14 rounded-lg object-cover bg-slate-100">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-900 text-sm">${bird.name}</h4>
                        <p class="text-xs italic text-slate-500">${bird.scientific}</p>
                        <span class="inline-block mt-1 text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-medium">${bird.status}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
